[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gbm-quant"
version = "2.0.0"
description = "Geometric Brownian Motion and advanced stochastic models for equity forecasting, options pricing and risk analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.TXT" }
authors = [{ name = "Yavuz Akbay", email = "akbay.yavuz@gmail.com" }]
keywords = ["quantitative-finance", "monte-carlo", "heston", "options-pricing", "risk"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

# Upper bounds are deliberate: yfinance, shap and numpy have all made
# breaking changes in minor releases that silently altered results here.
dependencies = [
    "numpy>=1.24,<3.0",
    "pandas>=2.0,<3.0",
    "scipy>=1.10,<2.0",
    "yfinance>=0.2.40,<0.3",
    "matplotlib>=3.7,<4.0",
    "scikit-learn>=1.3,<2.0",
    "statsmodels>=0.14,<0.15",
]

[project.optional-dependencies]
ml = ["torch>=2.0,<3.0"]
explain = ["shap>=0.44,<0.50", "seaborn>=0.13,<0.14", "plotly>=5.18,<7.0"]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.6,<0.13",
]
all = ["gbm-quant[ml,explain]"]

[project.scripts]
gbm = "gbm.cli:main"

[project.urls]
Homepage = "https://github.com/YavuzAkbay/GeometricBrownianMotion"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: test requires live network access (deselected in CI)",
    "slow: long-running test",
]
# Numerical warnings must be visible. A RuntimeWarning from sqrt/log is how a
# broken discretisation announces itself; the old code globally silenced these.
filterwarnings = [
    "error::RuntimeWarning",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "NPY", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]
